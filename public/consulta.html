<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consulta de Certificado - Litoplas Academy</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-container">
    <div class="auth-card" style="max-width: 500px;">
      <div class="logo-container">
        <img src="images/logo-litoplas.png" alt="Litoplas" class="logo-img" onerror="this.style.display='none'">
        <div class="logo-fallback">LITOPLAS</div>
      </div>
      <h2>Consulta de Certificado</h2>
      <p style="text-align:center; color:#6c757d; margin-bottom:20px;">Ingrese el número de documento para verificar la vigencia del certificado.</p>
      <input type="text" id="query-document" placeholder="Número de documento">
      <button id="btn-query">Consultar</button>
      <div id="query-result" style="margin-top:20px;"></div>
      <p style="text-align:center; margin-top:20px;">
        <a href="/" style="color:#0056A4; font-weight:600;">← Volver al curso</a>
      </p>
    </div>
  </div>

  <script>
    const API = window.location.origin;
    document.getElementById('btn-query').addEventListener('click', async () => {
      const doc = document.getElementById('query-document').value.trim().toUpperCase();
      const resDiv = document.getElementById('query-result');
      if (!doc) { resDiv.innerHTML = '<p class="msg-error">Ingrese un documento</p>'; return; }
      try {
        const res = await fetch(`${API}/api/public/certificate/${doc}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'No encontrado');
        const expiry = new Date(data.certificate_expiry);
        const now = new Date();
        const isValid = expiry > now;
        resDiv.innerHTML = `
          <div style="padding:20px; border-radius:12px; background:${isValid ? '#e8f5e9' : '#ffebee'}; border:2px solid ${isValid ? '#4CAF50' : '#E53935'};">
            <h3 style="color:${isValid ? '#2e7d32' : '#c62828'}; margin-bottom:12px;">${isValid ? '✅ CERTIFICADO VIGENTE' : '❌ CERTIFICADO VENCIDO'}</h3>
            <p><strong>Nombre:</strong> ${data.full_name}</p>
            <p><strong>Documento:</strong> ${data.document}</p>
            <p><strong>Empresa:</strong> ${data.company || 'N/A'}</p>
            <p><strong>Fecha de emisión:</strong> ${new Date(data.certificate_date).toLocaleDateString('es-CO')}</p>
            <p><strong>Vigente hasta:</strong> ${expiry.toLocaleDateString('es-CO')}</p>
          </div>
        `;
      } catch (err) {
        resDiv.innerHTML = `<p class="msg-error">${err.message}</p>`;
      }
    });
    document.getElementById('query-document').addEventListener('keypress', (e) => { if (e.key === 'Enter') document.getElementById('btn-query').click(); });
  </script>
</body>
</html>
